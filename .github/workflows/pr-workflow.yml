name: PR-WORKFLOW

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  save-pr-number:
    runs-on: ubuntu-latest
    steps:
    - name: make directory
      run: mkdir output
    - name: Save PR number
      run: echo ${{ github.event.number }} > ./output/NR
    - name: save to artifact
      uses: actions/upload-artifact@v4
      with:
        name: packets
        path: output

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mcVersionIndex: ['1.8.8', '1.9.4', '1.10.2', '1.11.2', '1.12.2', '1.13.2', '1.14.4', '1.15.2', '1.16.5', '1.17.1', '1.18.2', '1.19', '1.19.2', '1.19.3', '1.19.4', '1.20.1']
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v1
      with:
        node-version: 24.x
    - name: Setup Java JDK
      uses: actions/setup-java@v1.4.3
      with:
        java-version: 17
        java-package: jre
    - run: npm install
    - name: Use Dumper
      run: |
        mkdir output
        node bin/dumpPackets -v ${{ matrix.mcVersionIndex }} -o output/${{ matrix.mcVersionIndex }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packets-${{ matrix.mcVersionIndex }}
        path: output

  unit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js 24.x
      uses: actions/setup-node@v1
      with:
        node-version: 24.x
    - run: npm install
    - run: npm test

  # Stable branch-protection check; every required matrix job must pass.
  ci:
    name: ci
    if: ${{ always() }}
    needs: ["unit", "test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all mandatory jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_JOBS: '["unit", "test"]'
          MATRIX_OUTPUTS: '[]'
        shell: python
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = json.loads(os.environ["EXPECTED_JOBS"])
          if not expected or set(needs) != set(expected):
              sys.exit("Missing or unexpected required jobs")
          failed = {name: job.get("result") for name, job in needs.items()
                    if job.get("result") != "success"}
          if failed:
              sys.exit("Required jobs did not succeed: " + json.dumps(failed))
          for job, output, field in json.loads(os.environ["MATRIX_OUTPUTS"]):
              matrix = json.loads(needs[job]["outputs"][output])
              entries = matrix[field] if field else matrix
              if not isinstance(entries, list) or not entries:
                  sys.exit("Empty or invalid required matrix: " + job)
          print("All required jobs succeeded")
